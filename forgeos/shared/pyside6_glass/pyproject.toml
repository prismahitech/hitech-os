[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-atlas"
version = "0.1.0"
description = "Reusable PySide6 glass framework for workstation-style applications."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.5"]

[tool.setuptools]
packages = ["pyside6_glass"]
include-package-data = true

[tool.setuptools.package-dir]
pyside6_glass = "."
