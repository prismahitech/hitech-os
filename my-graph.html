
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Graph</title>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/viz.js@2.1.2-pre.1/viz.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/viz.js@2.1.2-pre.1/full.render.js"></script>
  <script>
const s = `
digraph {
	compound = "true"
	newrank = "true"
	subgraph "root" {
		"[root] @hitech/ai-agent#build" -> "[root] ___ROOT___"
		"[root] @hitech/contracts#build" -> "[root] ___ROOT___"
		"[root] @hitech/core-api#build" -> "[root] ___ROOT___"
		"[root] @hitech/demo-engine#build" -> "[root] ___ROOT___"
		"[root] @hitech/health#build" -> "[root] ___ROOT___"
		"[root] @hitech/keystone#build" -> "[root] @hitech/contracts#build"
		"[root] @hitech/keystone#build" -> "[root] @hitech/ui-kit#build"
		"[root] @hitech/scripts#build" -> "[root] ___ROOT___"
		"[root] @hitech/tooling#build" -> "[root] ___ROOT___"
		"[root] @hitech/ui-kit#build" -> "[root] ___ROOT___"
		"[root] @hitech/web#build" -> "[root] @hitech/contracts#build"
		"[root] @hitech/web#build" -> "[root] @hitech/ui-kit#build"
	}
}

`.replace(/\_\_\_ROOT\_\_\_/g, "Root").replace(/\[root\]/g, "");new Viz().renderSVGElement(s).then(el => document.body.appendChild(el)).catch(e => console.error(e));
  </script>
</body>
</html>
