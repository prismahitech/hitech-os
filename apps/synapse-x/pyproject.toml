[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-x-engine"
version = "0.3.0"
description = "Backend engine for SYNAPSE-X"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
charts = [
    "numpy>=1.26",
    "pyqtgraph>=0.13",
    "qtawesome>=1.3",
    "superqt>=0.6",
]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
