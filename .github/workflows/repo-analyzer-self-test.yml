name: repo-analyzer-self-test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  self-test:
    name: Repo Analyzer Headless Self-Test
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      HITECH_QT_SKIP_AUTO_INDEX: "1"
      HITECH_QT_FAILURE_INJECTION_MODE: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tools/graphviz/repo_analizer/requirements.txt

      - name: Install Qt runtime dependencies (Linux)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r tools/graphviz/repo_analizer/requirements.txt

      - name: Compile self-test and plugin runtime files
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/graphviz/repo_analizer/dev_self_test.py \
            tools/graphviz/repo_analizer/app/gui_qt/main_window.py \
            tools/graphviz/repo_analizer/app/gui_qt/plugins/plugin_manifest.py \
            tools/graphviz/repo_analizer/app/gui_qt/plugins/plugin_manager.py

      - name: Run normal developer self-test
        shell: bash
        run: |
          set -euo pipefail
          python tools/graphviz/repo_analizer/dev_self_test.py \
            --repo tools/graphviz/repo_analizer \
            --query plugin \
            --timeout-seconds 120 \
            --failure-mode off

  failure-injection-checks:
    name: Failure Injection (${{ matrix.mode }})
    runs-on: ubuntu-latest
    needs: self-test
    strategy:
      fail-fast: false
      matrix:
        mode: [load, init, integration]
    env:
      QT_QPA_PLATFORM: offscreen
      HITECH_QT_SKIP_AUTO_INDEX: "1"
      HITECH_QT_INCLUDE_DEV_TOOLS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tools/graphviz/repo_analizer/requirements.txt

      - name: Install Qt runtime dependencies (Linux)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r tools/graphviz/repo_analizer/requirements.txt

      - name: Validate deterministic failure path
        shell: bash
        run: |
          set -euo pipefail
          python tools/graphviz/repo_analizer/dev_self_test.py \
            --repo tools/graphviz/repo_analizer \
            --query plugin \
            --timeout-seconds 120 \
            --failure-mode "${{ matrix.mode }}"


