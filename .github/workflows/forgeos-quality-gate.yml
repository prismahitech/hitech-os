name: ForgeOS Quality Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: forgeos-quality-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  forgeos-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect ForgeOS scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          base_sha=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi
          if [ -z "${base_sha}" ] || [ "${base_sha}" = "0000000000000000000000000000000000000000" ]; then
            base_sha="$(git rev-parse HEAD~1)"
          fi
          changed_files="$(git diff --name-only "${base_sha}" "${GITHUB_SHA}")"
          if echo "${changed_files}" | grep -E '^(forgeos/|docs/forgeos-foundation/|\.github/workflows/forgeos-quality-gate\.yml)' >/dev/null; then
            echo "run_gate=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_gate=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        if: steps.scope.outputs.run_gate == 'true'
        with:
          python-version: "3.11"

      - name: Run ForgeOS quality gate
        if: steps.scope.outputs.run_gate == 'true'
        shell: pwsh
        run: |
          ./forgeos/scripts/Run-ForgeOSQualityGate.ps1 `
            -ForgeOSRoot "${{ github.workspace }}/forgeos" `
            -EvidenceDir "${{ github.workspace }}/tools/_local/evidence"

      - name: Skip non-ForgeOS changes
        if: steps.scope.outputs.run_gate != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "No ForgeOS-related changes detected. Check marked as PASS."

      - name: Upload ForgeOS quality evidence
        if: steps.scope.outputs.run_gate == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: forgeos-quality-gate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            tools/_local/evidence/forgeos_import_boundaries_report.json
            tools/_local/evidence/forgeos_package_dry_run_report.json
