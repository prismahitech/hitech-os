name: ForgeOS Quality Gate

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forgeos-source-quality-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  forgeos-source-quality:
    name: forgeos-source-quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Checkout PR source without repository token
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect ForgeOS scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          if echo "${changed_files}" | grep -E '^(forgeos/|docs/forgeos-foundation/|\.github/workflows/forgeos-quality-gate\.yml)' >/dev/null; then
            echo "run_gate=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_gate=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.scope.outputs.run_gate == 'true'
        with:
          python-version: "3.11"

      - name: Run ForgeOS quality gate
        if: steps.scope.outputs.run_gate == 'true'
        shell: pwsh
        run: |
          ./forgeos/scripts/Run-ForgeOSQualityGate.ps1 `
            -ForgeOSRoot "${{ github.workspace }}/forgeos" `
            -EvidenceDir "${{ github.workspace }}/tools/_local/evidence"

      - name: Non-ForgeOS source changes are non-governing
        if: steps.scope.outputs.run_gate != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "No ForgeOS-related changes detected; canonical PRISMA merge gate is the governing branch-protection check."
