name: License Pricing Canon

on:
  pull_request:
    paths:
      - 'apps/terminal-de-venta-system/shared/licensing/plan-catalog.canonical.json'
      - 'apps/terminal-de-venta-system/shared/licensing/plan-catalog.ts'
      - 'apps/terminal-de-venta-system/docs/productization/PRISMA_PLAN_CATALOG_CONTRACT.md'
      - 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/command_center_store.py'
      - 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/commercial_contracts.py'
      - 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.js'
      - 'apps/terminal-de-venta-system/tools/verify-license-commercial-pricing-01.mjs'
      - 'apps/terminal-de-venta-system/tools/verify-cloud-center-commercial-contract-01.py'
      - '.github/workflows/license-pricing-canon.yml'
  push:
    branches: ['main']
    paths:
      - 'apps/terminal-de-venta-system/shared/licensing/plan-catalog.canonical.json'
      - 'apps/terminal-de-venta-system/shared/licensing/plan-catalog.ts'
      - 'apps/terminal-de-venta-system/docs/productization/PRISMA_PLAN_CATALOG_CONTRACT.md'
      - 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/command_center_store.py'
      - 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/commercial_contracts.py'
      - 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.js'
      - 'apps/terminal-de-venta-system/tools/verify-license-commercial-pricing-01.mjs'
      - 'apps/terminal-de-venta-system/tools/verify-cloud-center-commercial-contract-01.py'
      - '.github/workflows/license-pricing-canon.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  license-pricing-canon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate canonical JSON
        run: python -m json.tool apps/terminal-de-venta-system/shared/licensing/plan-catalog.canonical.json > /dev/null

      - name: Run exact Authority Mesh preflight
        run: >-
          python apps/terminal-de-venta-system/tools/prisma-governance/authority_mesh.py
          --repo apps/terminal-de-venta-system
          --output .governance/current
          --full
          --task "OPERACIONALIZAR PRICING CANONICO PRISMA EN PRISMA CLOUD CENTER Y CONTRATO COMERCIAL LOCAL: hacer que Cloud Center consuma y muestre los precios canonicos TABLET_SOLO, TABLET_PRO y TABLET_PC_MANAGED en MXN mas IVA para mensual/trimestral/semestral/anual; al preparar licencia registrar contrato comercial trazable con plan, billingPeriod, listPriceMxn, agreedPriceMxn, priceVersion, taxTreatment, validFrom, validUntil, renewalOn y grandfathering sin inferir precio historico del primer cliente; preservar LICFLOW3, Customer Setup, entitlements, limites, pricing-policy de mercancia, Prisma DB, Cloudflare/D1 y superficies Tablet/PC/Mobile; UI limitada a proyeccion de datos en Prisma Cloud Center sin cambio de estilo, CSS ni Visual OS; exigir layer map y evidencia, sin fake green."

      - name: Require Authority Mesh outputs and pricing layers map
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('apps/terminal-de-venta-system/.governance/current')
          required = [
              'AUTHORITY_READSET.lock.json',
              'APP_IMPACT_MATRIX.md',
              'CONTRACT_AND_GATE_MATRIX.json',
              'MISSING_OR_UNMAPPED_RISK.md',
              'AGENT_PROMPT_ENVELOPE.md',
              'AUTHORITY_MESH_REPORT.md',
          ]
          missing = [name for name in required if not (root / name).exists()]
          if missing:
              raise SystemExit('Missing Authority Mesh outputs: ' + ', '.join(missing))

          lock = json.loads((root / 'AUTHORITY_READSET.lock.json').read_text(encoding='utf-8'))
          visual_tokens = ('visual', 'layer', 'recipe', 'glass', 'background', 'surface-adapter', 'authority-map')
          entries = [
              item for item in lock.get('readset', [])
              if any(token in str(item.get('path', '')).lower() for token in visual_tokens)
          ]
          if not entries:
              raise SystemExit('No visual/layer authority found in fresh readset')

          lines = [
              '# PRISMA Pricing Operations Layers Map',
              '',
              '- Change class: commercial pricing projection + local commercial contract.',
              '- UI mutation: bounded content/data projection in Prisma Cloud Center only.',
              '- Style mutation: none; no CSS, Visual OS, Tablet, PC or Mobile surface mutation.',
              '- Visual positioning remains governed commercial context, not an entitlement.',
              '',
              '| Authority path | Reason |',
              '|---|---|',
          ]
          for item in entries[:80]:
              path = str(item.get('path', '')).replace('|', '/')
              reason = str(item.get('reason', '')).replace('|', '/')
              lines.append(f'| `{path}` | {reason} |')
          (root / 'PRICING_LAYERS_MAP.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')

      - name: Verify commercial pricing canon
        run: node apps/terminal-de-venta-system/tools/verify-license-commercial-pricing-01.mjs

      - name: Compile Cloud Center commercial projection
        run: >-
          python -m py_compile
          "apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/commercial_contracts.py"
          "apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/command_center_store.py"

      - name: Check Cloud Center JavaScript syntax
        run: node --check "apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.js"

      - name: Verify Cloud Center commercial contract behavior
        run: python apps/terminal-de-venta-system/tools/verify-cloud-center-commercial-contract-01.py

      - name: Guard visual scope and product-pricing boundary
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          doc = Path('apps/terminal-de-venta-system/docs/productization/PRISMA_PLAN_CATALOG_CONTRACT.md').read_text(encoding='utf-8')
          assert 'pricing-policy' in doc
          assert 'No confundir pricing de licencia PRISMA con pricing de mercancia del comercio.' in doc

          changed = subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'], text=True).splitlines()
          style_mutations = [p for p in changed if p.lower().endswith(('.css','.scss','.sass','.less'))]
          forbidden_surface_mutations = [p for p in changed if '/products/tablet/' in p or '/products/mobile/' in p or '/products/pc/' in p]
          if style_mutations:
              raise SystemExit('Pricing operations PR must not mutate styles: ' + ', '.join(style_mutations))
          if forbidden_surface_mutations:
              raise SystemExit('Pricing operations PR must not mutate Tablet/PC/Mobile product surfaces: ' + ', '.join(forbidden_surface_mutations))
          print('PASS_LICENSE_VS_MERCHANDISE_PRICING_BOUNDARY')
          print('PASS_PRICING_OPS_NO_STYLE_OR_PRODUCT_SURFACE_MUTATION')
          print('VISUAL_RUNTIME_STATUS=PENDING_OPERATOR_RUNTIME_SCREENSHOT')

      - name: Upload governance evidence
        uses: actions/upload-artifact@v4
        with:
          name: license-pricing-canon-governance
          path: |
            apps/terminal-de-venta-system/.governance/current/AUTHORITY_READSET.lock.json
            apps/terminal-de-venta-system/.governance/current/APP_IMPACT_MATRIX.md
            apps/terminal-de-venta-system/.governance/current/CONTRACT_AND_GATE_MATRIX.json
            apps/terminal-de-venta-system/.governance/current/MISSING_OR_UNMAPPED_RISK.md
            apps/terminal-de-venta-system/.governance/current/AGENT_PROMPT_ENVELOPE.md
            apps/terminal-de-venta-system/.governance/current/AUTHORITY_MESH_REPORT.md
            apps/terminal-de-venta-system/.governance/current/PRICING_LAYERS_MAP.md
