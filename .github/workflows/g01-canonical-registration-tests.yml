name: G01 Canonical Registration Hardening Tests

on:
  push:
    branches:
      - "feat/visual-canonical-registration-g01-hardening-20260929"

permissions:
  contents: read

jobs:
  canonical-registration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r prisma-html/requirements-dev.txt
      - name: Compile canonical registration modules
        working-directory: prisma-html
        run: python -m compileall -q tools/visual_promotion/canonical_registration
      - name: Run canonical registration regression suite
        working-directory: prisma-html
        shell: bash
        run: |
          set -euo pipefail
          for test in tools/visual_promotion/canonical_registration/tests/test_*.py; do
            PYTHONPATH=tools python "$test"
          done
