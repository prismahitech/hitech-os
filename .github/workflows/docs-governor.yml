name: docs-governor

on:
  push:
    paths:
      - "docs/**"
      - "tools/docs_governor/**"
      - ".github/workflows/docs-governor.yml"
      - "!docs/knowledge/codex_chats/**"

  pull_request:
    paths:
      - "docs/**"
      - "tools/docs_governor/**"
      - ".github/workflows/docs-governor.yml"
      - "!docs/knowledge/codex_chats/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  docs-governor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run docs governor
        run: |
          python tools/docs_governor/docs_governor.py --repo . --report-dir tools/docs_governor/reports

      - name: Upload governance report if failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docs-governor-report
          path: tools/docs_governor/reports/*.json
          if-no-files-found: ignore
