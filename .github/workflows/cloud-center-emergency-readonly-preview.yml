name: Cloud Center Emergency Read-only Preview

on:
  push:
    branches:
      - governance/cloud-center-roadmap-step1-20260929
    paths:
      - "apps/terminal-de-venta-system/infra/cloudflare/licflow3-worker/**"
      - "apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/cloud_saas_api.py"
      - ".github/workflows/cloud-center-emergency-readonly-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-center-emergency-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emergency-preview:
    name: Upload read-only Cloud Center preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Validate Cloudflare credentials
        working-directory: apps/terminal-de-venta-system/infra/cloudflare/licflow3-worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Missing GitHub secret: CLOUDFLARE_API_TOKEN"; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID"; exit 2; }
          pnpm dlx wrangler@4.143.0 whoami

      - name: Enable Worker Preview URLs without production traffic
        env:
          WORKER_NAME: prisma-cloud-semilla
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2             -o "${RUNNER_TEMP}/cloud-center-worker-subdomain-before.json"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/subdomain"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          node <<'NODE'
          const fs = require("node:fs");
          const path = process.env.RUNNER_TEMP + "/cloud-center-worker-subdomain-before.json";
          const data = JSON.parse(fs.readFileSync(path, "utf8"));
          if (data.success !== true || !data.result || typeof data.result.enabled !== "boolean" || typeof data.result.previews_enabled !== "boolean") {
            throw new Error("Cloudflare returned an invalid Worker subdomain state");
          }
          fs.writeFileSync(
            process.env.RUNNER_TEMP + "/cloud-center-worker-subdomain-state.json",
            JSON.stringify(data.result)
          );
          if (data.result.previews_enabled === true) {
            process.stdout.write("Worker Preview URLs already enabled; no control-plane change needed.\n");
            process.exit(0);
          }
          process.stdout.write("Worker Preview URLs disabled; enabling previews while preserving workers.dev traffic state.\n");
          NODE

          enabled="$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/cloud-center-worker-subdomain-state.json", "utf8")).enabled')"

          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2             -X POST             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/subdomain"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             -H "content-type: application/json"             --data "{\"enabled\":${enabled},\"previews_enabled\":true}"             -o "${RUNNER_TEMP}/cloud-center-worker-subdomain-after.json"

          node <<'NODE'
          const fs = require("node:fs");
          const path = process.env.RUNNER_TEMP + "/cloud-center-worker-subdomain-after.json";
          const data = JSON.parse(fs.readFileSync(path, "utf8"));
          if (data.success !== true || data.result?.previews_enabled !== true) {
            throw new Error("Cloudflare did not confirm Worker Preview URLs enabled");
          }
          process.stdout.write("Worker Preview URLs enabled; workers.dev traffic state preserved as " + String(data.result.enabled) + ".\n");
          NODE

      - name: Upload emergency read-only Worker version
        working-directory: apps/terminal-de-venta-system/infra/cloudflare/licflow3-worker
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4.143.0 versions upload \
            --message "Cloud Center emergency read-only recovery preview" \
            --preview-alias cloud-center-recovery \
            --var "PRISMA_LICFLOW3_PREVIEW_MODE:readonly" \
            --strict 2>&1 | tee "${RUNNER_TEMP}/cloud-center-wrangler-upload.log"

      - name: Resolve Version URL
        id: url
        env:
          WORKER_NAME: prisma-cloud-semilla
          PREVIEW_ALIAS: cloud-center-recovery
        shell: bash
        run: |
          set -euo pipefail

          test -s "${RUNNER_TEMP}/cloud-center-wrangler-upload.log" || { echo "Wrangler upload log is empty"; exit 1; }

          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2             -o "${RUNNER_TEMP}/cloud-center-worker-metadata.json"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/workers/${WORKER_NAME}"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          preview_url="$(
            node -e '
              const fs = require("node:fs");
              const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/cloud-center-worker-metadata.json", "utf8"));
              const subdomain = data.result?.subdomain || {};
              if (subdomain.previews_enabled !== true) {
                process.stderr.write("Cloudflare reports Worker Preview URLs are disabled for " + process.env.WORKER_NAME + "\n");
                process.exit(2);
              }

              const raw = String(subdomain.preview_url_suffix || subdomain.url || "").trim();
              if (!raw) {
                process.stderr.write("Cloudflare returned no workers.dev host metadata for " + process.env.WORKER_NAME + "\n");
                process.exit(3);
              }

              const candidate = raw.startsWith("http://") || raw.startsWith("https://")
                ? raw
                : "https://" + raw;
              const parsed = new URL(candidate);
              const labels = parsed.hostname.split(".");
              const workerIndex = labels.findIndex(label => label === process.env.WORKER_NAME);

              if (workerIndex < 0) {
                process.stderr.write("Worker name was not present in Cloudflare workers.dev hostname\n");
                process.exit(4);
              }

              labels[workerIndex] = process.env.PREVIEW_ALIAS + "-" + labels[workerIndex];
              parsed.hostname = labels.join(".");
              const result = parsed.toString();
              process.stdout.write(result.endsWith("/") ? result.slice(0, -1) : result);
            '
          )"

          test -n "${preview_url}" || { echo "No workers.dev Preview URL resolved"; exit 1; }

          printf 'preview_url=%s\n' "${preview_url}" >> "${GITHUB_OUTPUT}"
          printf 'PREVIEW_URL=%s\n' "${preview_url}"

      - name: Verify read-only Version URL
        env:
          PREVIEW_URL: ${{ steps.url.outputs.preview_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "${PREVIEW_URL}/health" > health.json
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "${PREVIEW_URL}/api/public/capabilities" > capabilities.json
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "${PREVIEW_URL}/api/public/tenants/prisma-original-customer/status" > tenant-status.json
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "${PREVIEW_URL}/api/client/contract?tenant=prisma-original-customer" > contract.json

          node <<'NODE'
          const fs = require("node:fs");
          const health = JSON.parse(fs.readFileSync("health.json", "utf8"));
          const caps = JSON.parse(fs.readFileSync("capabilities.json", "utf8"));
          const tenant = JSON.parse(fs.readFileSync("tenant-status.json", "utf8"));
          const contract = JSON.parse(fs.readFileSync("contract.json", "utf8"));
          if (health.ok !== true || health.dbHealth !== "D1_BOUND") throw new Error("Version URL health/D1 check failed");
          if (caps.ok !== true) throw new Error("Version URL capabilities check failed");
          if (!tenant || typeof tenant !== "object") throw new Error("Version URL tenant status check failed");
          if (!contract || typeof contract !== "object") throw new Error("Version URL contract check failed");
          NODE

          status=$(curl --silent --output mutation-body.json --write-out "%{http_code}" \
            -X POST "${PREVIEW_URL}/api/licenses/activate" \
            -H "content-type: application/json" \
            --data '{"dryRun":true,"tenantSlug":"cloud-center-emergency-preview","licenseId":"cloud-center-emergency-preview"}')

          test "${status}" = "403" || { echo "Expected read-only guard 403, got ${status}"; cat mutation-body.json; exit 1; }
          grep -q '"READ_ONLY_PREVIEW"' mutation-body.json || { echo "Read-only guard marker missing"; cat mutation-body.json; exit 1; }

      - name: Write recovery evidence
        env:
          PREVIEW_URL: ${{ steps.url.outputs.preview_url }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const evidence = {
            status: "PASS_EMERGENCY_READONLY_PREVIEW",
            previewUrl: process.env.PREVIEW_URL,
            worker: "prisma-cloud-semilla",
            d1: "prisma_cloud_semilla",
            publicTarget: "https://app.hitechrts.com",
            productionTrafficChanged: false,
            dnsChanged: false,
            d1MutationPerformed: false,
            mutationGuard: "POST -> 403 READ_ONLY_PREVIEW",
            generatedAt: new Date().toISOString()
          };
          fs.writeFileSync("cloud-center-emergency-preview.json", JSON.stringify(evidence, null, 2) + "\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "## Cloud Center emergency preview\n\n**Preview URL:** " + process.env.PREVIEW_URL + "\n\nProduction traffic was not promoted; DNS was not changed; preview mutation guard returned 403.\n");
          NODE

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-center-emergency-readonly-preview-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            cloud-center-emergency-preview.json
            health.json
            capabilities.json
            tenant-status.json
            contract.json
            mutation-body.json
            ${{ runner.temp }}/cloud-center-wrangler-upload.log
