name: contract-python-parity

on:
  pull_request:
    paths:
      - "packages/contracts/**"
      - "services/ai-agent/**"
      - "tools/scripts/check_contract_python_parity.py"
      - ".github/workflows/contract-python-parity.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "packages/contracts/**"
      - "services/ai-agent/**"
      - "tools/scripts/check_contract_python_parity.py"
      - ".github/workflows/contract-python-parity.yml"
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run contract/python parity check
        run: python tools/scripts/check_contract_python_parity.py --repo-root . --strict
