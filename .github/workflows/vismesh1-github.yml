name: VISMESH1 GitHub Authority Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/vismesh1-github.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  authority-mesh:
    name: Fresh PRISMA visual authority mesh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Reset temporary governance workspace
        working-directory: apps/terminal-de-venta-system
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .governance/current
          mkdir -p .governance/current

      - name: Run exact full-surface Authority Mesh
        working-directory: apps/terminal-de-venta-system
        shell: bash
        run: |
          set -euo pipefail
          TASK='Consolidar prisma-html como unica autoridad visual editable de PRISMA; eliminar autoridades visuales editables duplicadas sin eliminar proyecciones generadas; convertir Atlasfin en la cabina visual humana unica; reconciliar Identity Dictionary, RIFAT, prisma-ui, sistema-ui y Atlasfin; generalizar bindings, layers, editable slots y runtime projection para Tablet, PC, Mobile, Web, Chart Lab, Control Center y Shared UI; reconciliar READMEs, TREE, manifests y readiness; preservar comportamiento funcional; cero !important; cero DB/Prisma/process/port changes; incluir Layer Map completo y no reclamar ready sin evidencia.'
          python tools/prisma-governance/authority_mesh.py \
            --task "$TASK" \
            --full \
            --output .governance/current

      - name: Snapshot canonical Layer Map from current repository commit
        working-directory: apps/terminal-de-venta-system
        shell: bash
        run: |
          set -euo pipefail
          cp docs/visual-layer-map/layer-map.json .governance/current/LAYERS_MAP.json
          cp docs/visual-layer-map/LAYER_MAP.md .governance/current/LAYERS_MAP.md
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out = Path('.governance/current')
          sources = [
              ('docs/visual-layer-map/layer-map.json', out / 'LAYERS_MAP.json'),
              ('docs/visual-layer-map/LAYER_MAP.md', out / 'LAYERS_MAP.md'),
          ]
          rows = []
          for source, snap in sources:
              data = snap.read_bytes()
              rows.append({
                  'source': source,
                  'snapshot': snap.name,
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          payload = {
              'schema': 'prisma.authority-mesh.layer-map-snapshot.v1',
              'taskScoped': True,
              'sourceCommit': os.environ.get('GITHUB_SHA'),
              'policy': 'Current tracked canonical layer map is snapshotted into the fresh Mesh artifact; no stale .governance/current residue is accepted.',
              'files': rows,
          }
          (out / 'LAYERS_MAP_SOURCE.json').write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Verify mandatory authority outputs
        working-directory: apps/terminal-de-venta-system
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            AUTHORITY_READSET.lock.json \
            APP_IMPACT_MATRIX.md \
            CONTRACT_AND_GATE_MATRIX.json \
            MISSING_OR_UNMAPPED_RISK.md \
            AGENT_PROMPT_ENVELOPE.md \
            AUTHORITY_MESH_REPORT.md \
            LAYERS_MAP.json \
            LAYERS_MAP.md \
            LAYERS_MAP_SOURCE.json
          do
            test -s ".governance/current/$f" || { echo "MISSING_OR_EMPTY=$f"; exit 1; }
          done
          echo 'VISMESH1_MANDATORY_OUTPUTS=PASS'

      - name: Upload fresh Mesh artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vismesh1-authority-mesh
          path: apps/terminal-de-venta-system/.governance/current
          if-no-files-found: error
          retention-days: 14
