name: Cloud Center Live Read-only Recertification

on:
  push:
    branches:
      - governance/cloud-center-roadmap-step1-20260929
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-center-live-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-readonly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Diagnose public Cloud Center reachability
        shell: bash
        run: |
          set -u
          printf 'Cloud Center DNS preflight:\n'
          getent hosts app.hitechrts.com || true
          set +e
          curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -w 'Cloud Center health preflight: HTTP=%{http_code} REMOTE_IP=%{remote_ip} CONNECT=%{time_connect} TOTAL=%{time_total}\n' https://app.hitechrts.com/health
          rc=$?
          set -e
          printf 'Cloud Center health preflight curl_exit=%s\n' "$rc"
          exit 0

      - name: Run Cloud Center public live read-only verifier
        working-directory: apps/terminal-de-venta-system
        run: |
          set -euo pipefail
          mkdir -p tools/_local/reports/ci/cloud-center-live
          node tools/verify-cloud-center-live-readiness.mjs --out=tools/_local/reports/ci/cloud-center-live/CLOUD_CENTER_LIVE_READONLY_VERIFY.json

      - name: Upload live read-only evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-center-live-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: apps/terminal-de-venta-system/tools/_local/reports/ci/cloud-center-live/
