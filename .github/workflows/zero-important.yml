name: Zero Priority Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  zero-priority-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check gate modules
        run: |
          node --check tools/quality/verify-zero-important.mjs
          find tools/quality/zero-important -name '*.mjs' -print0 | xargs -0 -I{} node --check {}
      - name: Self-test zero priority gate
        run: node tools/quality/verify-zero-important.mjs --self-test
      - name: Run zero priority gate
        run: node tools/quality/verify-zero-important.mjs --mode repo-tree --format text
