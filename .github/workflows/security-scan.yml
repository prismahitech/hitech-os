name: Security Scan

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "services/**"
      - "packages/contracts/**"
      - "apps/keystone/app/api/**"
      - "tools/codex/**"
      - "tools/graphviz/**"
      - "tools/hos/**"
      - "terraform/**"
      - "helm/**"
      - "k8s/**"
      - "policies/security.json"
      - "tools/scripts/report_sensitive_paths.mjs"
      - ".github/workflows/security-scan.yml"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - "services/**"
      - "packages/contracts/**"
      - "apps/keystone/app/api/**"
      - "tools/codex/**"
      - "tools/graphviz/**"
      - "tools/hos/**"
      - "terraform/**"
      - "helm/**"
      - "k8s/**"
      - "policies/security.json"
      - "tools/scripts/report_sensitive_paths.mjs"
      - ".github/workflows/security-scan.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  security-report:
    runs-on: ubuntu-latest
    env:
      REPORT_DIR: tools/_local/reports/ci
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Resolve diff base SHA
        id: base
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          if [ -z "${base_sha}" ] || [ "${base_sha}" = "null" ]; then
            base_sha="${{ github.event.before }}"
          fi
          if [ -z "${base_sha}" ] || [ "${base_sha}" = "null" ] || [ "${base_sha}" = "0000000000000000000000000000000000000000" ]; then
            base_sha="HEAD~1"
          fi
          echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"

      - name: Sensitive path and secret-sprawl report (non-blocking policy mode)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          node tools/scripts/report_sensitive_paths.mjs \
            --base "${{ steps.base.outputs.base_sha }}" \
            --head "${GITHUB_SHA}" \
            --output "${REPORT_DIR}/sensitive_paths.security_scan.json"
          node tools/scripts/report_codeowners_coverage.mjs \
            --output "${REPORT_DIR}/codeowners_coverage.security_scan.json"

      - name: Upload security observability reports
        uses: actions/upload-artifact@v7
        with:
          name: security-scan-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            tools/_local/reports/ci/sensitive_paths.security_scan.json
            tools/_local/reports/ci/codeowners_coverage.security_scan.json


